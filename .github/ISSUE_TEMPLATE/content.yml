name: 内容纠错或选题
description: 报告中文指南的问题，或提出一个具体选题。
body:
  - type: input
    id: page
    attributes:
      label: 页面地址或主题
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 问题与证据
      description: 哪个步骤或事实需要修改？附官方来源或脱敏后的环境与错误。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果或建议
