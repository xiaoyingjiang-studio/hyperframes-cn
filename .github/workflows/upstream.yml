name: Sync official content
on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  issues: write
  statuses: write
concurrency:
  group: content-maintenance
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: batch
        run: node scripts/github-sync.mjs begin
      - name: Detect while preserving open review
        if: steps.batch.outputs.busy == 'true'
        run: pnpm sync --report-only
      - name: Prepare a new review batch
        if: steps.batch.outputs.busy != 'true'
        run: pnpm sync --apply
        env:
          AI_ENDPOINT: ${{ vars.AI_ENDPOINT }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MAX_BATCH_PAGES: '5'
          AI_MAX_CALLS: '15'
          AI_MAX_TOTAL_TOKENS: '100000'
      - run: node scripts/github-sync.mjs report
      - name: Validate generated changes in this run
        if: steps.batch.outputs.busy != 'true'
        run: pnpm check && pnpm test && pnpm build
      - name: Open draft PR only for meaningful upstream changes
        if: steps.batch.outputs.busy != 'true'
        run: |
          set -euo pipefail
          changed=$(node -e "const r=JSON.parse(require('fs').readFileSync('.upstream/report.json'));console.log(Boolean(r.affected.length||r.changes.length))")
          if [ "$changed" != true ]; then exit 0; fi
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e
          git config user.name 'hyperframes-cn-bot'
          git config user.email 'hyperframes-cn-bot@users.noreply.github.com'
          git switch -C automation/upstream
          git add .upstream content src/content/docs
          git commit -m 'docs: prepare official content review'
          git push --force-with-lease origin automation/upstream
          node scripts/github-sync.mjs pr
      - name: Preserve reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upstream-report
          path: |
            .upstream/report.json
            content/sync-status.json
          if-no-files-found: ignore
      - name: Report collection failure
        if: failure()
        run: node scripts/github-sync.mjs failure
