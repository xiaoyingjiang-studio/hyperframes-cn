name: Deploy production
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production
  cancel-in-progress: false
jobs:
  configuration:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.config.outputs.ready }}
    steps:
      - name: Check deployment configuration without exposing secrets
        id: config
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          URL: ${{ vars.SITE_URL }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ] && [ -n "$URL" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Automatic deployment is waiting for Cloudflare Secrets and SITE_URL. Local Wrangler deployment remains available.' >> "$GITHUB_STEP_SUMMARY"
          fi
  deploy:
    needs: configuration
    if: needs.configuration.outputs.ready == 'true'
    runs-on: ubuntu-latest
    environment: production
    env:
      SITE_URL: ${{ vars.SITE_URL }}
      SITE_INDEXABLE: ${{ vars.SITE_INDEXABLE || 'false' }}
      PUBLIC_REPOSITORY: https://github.com/${{ github.repository }}
      OLD_DEFAULT_HOST: ${{ vars.OLD_DEFAULT_HOST }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check && pnpm test
      - run: node scripts/validate-content.mjs --production
      - run: pnpm build
      - name: Require a real deployment URL
        run: node -e "if(!process.env.SITE_URL?.startsWith('https://')) throw Error('Configure the actual workers.dev or custom SITE_URL before deploying')"
      - name: Deploy static assets
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: node scripts/smoke.mjs
        env:
          SMOKE_URL: ${{ vars.SITE_URL }}
      - name: Record release
        run: echo "Published commit $GITHUB_SHA to $SITE_URL" >> "$GITHUB_STEP_SUMMARY"
