name: SEO and GEO maintenance
on:
  workflow_dispatch:
permissions:
  actions: write
  contents: read
jobs:
  dispatch:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Use the same verified content and publication pipeline
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: gh api --method POST "repos/$REPOSITORY/actions/workflows/upstream.yml/dispatches" -f ref=main -F 'inputs[optimize]=true'
