name: Build creator knowledge
on:
  schedule:
    # Monday and Thursday at 08:30 Asia/Shanghai (UTC+8).
    - cron: '30 0 * * 1,4'
  workflow_dispatch:
    inputs:
      optimize:
        description: Use real observations to improve existing content
        type: boolean
        default: false
      entity:
        description: Optional registered topic ID for one-time validation
        type: string
        default: ''
permissions:
  contents: write
  pull-requests: write
  statuses: write
concurrency:
  group: content-maintenance
  cancel-in-progress: false
jobs:
  knowledge:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      merged_sha: ${{ steps.publish.outputs.merged_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Resolve the protected branch after the concurrency wait, then pin its
          # actual SHA in batch.base for every later check and merge.
          ref: main
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: batch
        run: node scripts/github-publish.mjs begin
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Preserve an existing automation branch
        if: steps.batch.outputs.busy == 'true'
        run: pnpm knowledge:inventory
      - name: Read optional finalized search observations
        if: steps.batch.outputs.busy != 'true' && inputs.optimize
        continue-on-error: true
        run: pnpm metrics:collect
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          SITE_INDEXABLE: ${{ vars.SITE_INDEXABLE || 'false' }}
          GSC_PROPERTY: ${{ vars.GSC_PROPERTY }}
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
      - name: Generate and independently verify coherent content units
        if: steps.batch.outputs.busy != 'true'
        run: |
          if [ "$OPTIMIZE" = true ]; then
            pnpm knowledge:sync --apply --optimize
          else
            pnpm knowledge:sync --apply
          fi
        env:
          OPTIMIZE: ${{ inputs.optimize || 'false' }}
          KNOWLEDGE_TARGET: ${{ inputs.entity || '' }}
          OPTIMIZATION_OBSERVATIONS: artifacts/search-observations.json
          GITHUB_TOKEN: ${{ github.token }}
          AI_ENDPOINT: ${{ vars.AI_ENDPOINT }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MAX_BATCH_PAGES: '5'
          AI_MAX_CALLS: '15'
          AI_MAX_TOTAL_TOKENS: '100000'
          OPTIMIZE_MAX_PAGES: '3'
      - name: Commit material changes before checking the exact tree
        id: changes
        if: steps.batch.outputs.busy != 'true'
        run: |
          set -euo pipefail
          if git diff --quiet -- . ':!content/sync-status.json'; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'hyperframes-cn-bot'
          git config user.email 'hyperframes-cn-bot@users.noreply.github.com'
          git add .upstream content src/content/docs
          git commit -m 'docs: update verified creator knowledge'
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - name: Validate exact content, evidence and generated site
        if: steps.changes.outputs.changed == 'true'
        run: |
          node scripts/content-guard.mjs
          pnpm check
          pnpm test
          node scripts/validate-content.mjs --production
          pnpm build
          pnpm test:indexing
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e
          test -z "$(git status --porcelain --untracked-files=no)"
        env:
          CONTENT_BASE_SHA: ${{ steps.batch.outputs.base }}
      - name: Automatically merge the checked content commit
        id: publish
        if: steps.changes.outputs.changed == 'true'
        run: node scripts/github-publish.mjs merge
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CONTENT_BASE_SHA: ${{ steps.batch.outputs.base }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: knowledge-reports
          include-hidden-files: true
          path: |
            artifacts/
            .upstream/candidates/
            playwright-report/
          if-no-files-found: ignore
  deploy:
    needs: knowledge
    if: needs.knowledge.outputs.merged_sha != ''
    uses: ./.github/workflows/deploy.yml
    with:
      sha: ${{ needs.knowledge.outputs.merged_sha }}
    secrets: inherit
